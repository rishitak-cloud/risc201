><text x="724.0" y="222.5" font-size="12" xml:space="preserve" text-anchor="middle" font-weight="bold" fill="#1b2733" font-family="Helvetica, Arial, sans-serif">imm (16)</text><text x="504" y="255" font-size="10" xml:space="preserve" text-anchor="start" font-weight="normal" fill="#666" font-family="Helvetica, Arial, sans-serif">15</text><text x="944" y="255" font-size="10" xml:space="preserve" text-anchor="end" font-weight="normal" fill="#666" font-family="Helvetica, Arial, sans-serif">0</text><text x="52" y="275" font-size="12" xml:space="preserve" text-anchor="start" font-weight="normal" fill="#444" font-style="italic" font-family="Helvetica, Arial, sans-serif">e.g.  add r1, r2, -5     movh r1, 0x1234     ld r1, 8[sp]</text><text x="52" y="300" font-size="14" xml:space="preserve" text-anchor="start" font-weight="bold" fill="#1b2733" font-family="Helvetica, Arial, sans-serif">Branch</text><rect x="52" y="312" width="140" height="42" rx="0" fill="#ffe3e3" stroke="#2b3a4a" stroke-width="1.5"/><text x="122.0" y="337.5" font-size="12" xml:space="preserve" text-anchor="middle" font-weight="bold" fill="#1b2733" font-family="Helvetica, Arial, sans-serif">opcode</text><text x="56" y="370" font-size="10" xml:space="preserve" text-anchor="start" font-weight="normal" fill="#666" font-family="Helvetica, Arial, sans-serif">31</text><text x="188" y="370" font-size="10" xml:space="preserve" text-anchor="end" font-weight="normal" fill="#666" font-family="Helvetica, Arial, sans-serif">27</text><rect x="192" y="312" width="756" height="42" rx="0" fill="#ffe8cc" stroke="#2b3a4a" stroke-width="1.5"/><text x="570.0" y="337.5" font-size="12" xml:space="preserve" text-anchor="middle" font-weight="bold" fill="#1b2733" font-family="Helvetica, Arial, sans-serif">offset (27, in words)</text><text x="196" y="370" font-size="10" xml:space="preserve" text-anchor="start" font-weight="normal" fill="#666" font-family="Helvetica, Arial, sans-serif">26</text><text x="944" y="370" font-size="10" xml:space="preserve" text-anchor="end" font-weight="normal" fill="#666" font-family="Helvetica, Arial, sans-serif">0</text><text x="52" y="390" font-size="12" xml:space="preserve" text-anchor="start" font-weight="normal" fill="#444" font-style="italic" font-family="Helvetica, Arial, sans-serif">e.g.  beq loop     call fact        target = PC + offset x 4</text><text x="52" y="425" font-size="12" xml:space="preserve" text-anchor="start" font-weight="normal" fill="#333" font-family="Helvetica, Arial, sans-serif">mod: 00 = sign-extend    01 (u) = zero-extend    10 (h) = load into upper 16 bits.     r14 = sp,  r15 = ra,  flags = {E, GT} set only by cmp</text></svg>