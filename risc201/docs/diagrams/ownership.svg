5" y="144.5" font-size="12" xml:space="preserve" text-anchor="middle" font-weight="normal" fill="#1b2733" font-family="Helvetica, Arial, sans-serif">microcode.py</text><rect x="720" y="161" width="175" height="30" rx="6" fill="#fff" stroke="#2b3a4a" stroke-width="1.5"/><text x="807.5" y="180.5" font-size="12" xml:space="preserve" text-anchor="middle" font-weight="normal" fill="#1b2733" font-family="Helvetica, Arial, sans-serif">cpu.py</text><rect x="975" y="60" width="295" height="180" rx="6" fill="#effaf1" stroke="#2b3a4a" stroke-width="1.5"/><text x="1122" y="88" font-size="16" xml:space="preserve" text-anchor="middle" font-weight="bold" fill="#1b2733" font-family="Helvetica, Arial, sans-serif">Member D</text><text x="1122" y="110" font-size="12" xml:space="preserve" text-anchor="middle" font-weight="normal" fill="#444" font-family="Helvetica, Arial, sans-serif">ALU + CLI debugger  (1c, 2c, 2d)</text><rect x="1035" y="125" width="175" height="30" rx="6" fill="#fff" stroke="#2b3a4a" stroke-width="1.5"/><text x="1122.5" y="144.5" font-size="12" xml:space="preserve" text-anchor="middle" font-weight="normal" fill="#1b2733" font-family="Helvetica, Arial, sans-serif">alu.py</text><rect x="1035" y="161" width="175" height="30" rx="6" fill="#fff" stroke="#2b3a4a" stroke-width="1.5"/><text x="1122.5" y="180.5" font-size="12" xml:space="preserve" text-anchor="middle" font-weight="normal" fill="#1b2733" font-family="Helvetica, Arial, sans-serif">cli.py</text><text x="650" y="280" font-size="13" xml:space="preserve" text-anchor="middle" font-weight="bold" fill="#1b2733" font-family="Helvetica, Arial, sans-serif">Interfaces - agree on these on day 1 and do not change them without telling the group</text><rect x="30" y="300" width="295" height="130" rx="6" fill="#fff" stroke="#2b3a4a" stroke-width="1.5"/><text x="177.5" y="347.0" font-size="13" xml:space="preserve" text-anchor="middle" font-weight="bold" fill="#1b2733" font-family="Helvetica, Arial, sans-serif">A gives everyone</text><text x="177.5" y="367.0" font-size="11" xml:space="preserve" text-anchor="middle" font-weight="normal" fill="#555" font-family="Helvetica, Arial, sans-serif">assemble(text) -> Program(.words, .code_end, .symbols)</text><text x="177.5" y="381.0" font-size="11" xml:space="preserve" text-anchor="middle" font-weight="normal" fill="#555" font-family="Helvetica, Arial, sans-serif">isa.decode(word) -> fields dict</text><text x="177.5" y="395.0" font-size="11" xml:space="preserve" text-anchor="middle" font-weight="normal" fill="#555" font-family="Helvetica, Arial, sans-serif">isa.format_instr(fields) -> text</text><rect x="345" y="300" width="295" height="130" rx="6" fill="#fff" stroke="#2b3a4a" stroke-width="1.5"/><text x="492.5" y="347.0" font-size="13" xml:space="preserve" text-anchor="middle" font-weight="bold" fill="#1b2733" font-family="Helvetica, Arial, sans-serif">B and C give D</text><text x="492.5" y="367.0" font-size="11" xml:space="preserve" text-anchor="middle" font-weight="normal" fill="#555" font-family="Helvetica, Arial, sans-serif">Pipeline (B), SingleCycleCPU (C):</text><text x="492.5" y="381.0" font-size="11" xml:space="preserve" text-anchor="middle" font-weight="normal" fill="#555" font-family="Helvetica, Arial, sans-serif">step()  run()  halted  show()</text><text x="492.5" y="395.0" font-size="11" xml:space="preserve" text-anchor="middle" font-weight="normal" fill="#555" font-family="Helvetica, Arial, sans-serif">stats()  breakpoints   (B: diagram())</text><rect x="660" y="300" width="295" height="130" rx="6" fill="#fff" stroke="#2b3a4a" stroke-width="1.5"/><text x="807.5" y="347.0" font-size="13" xml:space="preserve" text-anchor="middle" font-weight="bold" fill="#1b2733" font-family="Helvetica, Arial, sans-serif">D gives B and C</text><text x="807.5" y="367.0" font-size="11" xml:space="preserve" text-anchor="middle" font-weight="normal" fill="#555" font-family="Helvetica, Arial, sans-serif">alu.compute(op, a, b)</text><text x="807.5" y="381.0" font-size="11" xml:space="preserve" text-anchor="middle" font-weight="normal" fill="#555" font-family="Helvetica, Arial, sans-serif">alu.compare(a, b) -> (E, GT)</text><text x="807.5" y="395.0" font-size="11" xml:space="preserve" text-anchor="middle" font-weight="normal" fill="#555" font-family="Helvetica, Arial, sans-serif">alu.add(a, b)</text><rect x="975" y="300" width="295" height="130" rx="6" fill="#fff" stroke="#2b3a4a" stroke-width="1.5"/><text x="1122.5" y="347.0" font-size="13" xml:space="preserve" text-anchor="middle" font-weight="bold" fill="#1b2733" font-family="Helvetica, Arial, sans-serif">Shared state (B owns)</text><text x="1122.5" y="367.0" font-size="11" xml:space="preserve" text-anchor="middle" font-weight="normal" fill="#555" font-family="Helvetica, Arial, sans-serif">Machine(program, alu)</text><text x="1122.5" y="381.0" font-size="11" xml:space="preserve" text-anchor="middle" font-weight="normal" fill="#555" font-family="Helvetica, Arial, sans-serif">.regs.read / .regs.write</text><text x="1122.5" y="395.0" font-size="11" xml:space="preserve" text-anchor="middle" font-weight="normal" fill="#555" font-family="Helvetica, Arial, sans-serif">.mem.load / .mem.store   .flags.E / .GT</text><text x="650" y="470" font-size="13" xml:space="preserve" text-anchor="middle" font-weight="bold" fill="#1b2733" font-family="Helvetica, Arial, sans-serif">Each member can test alone:</text><text x="650" y="492" font-size="11" xml:space="preserve" text-anchor="middle" font-weight="normal" fill="#1b2733" font-family="Helvetica, Arial, sans-serif">A: assemble -> disassemble -> assemble gives the same words      B: both pipelines end like cpu.py      C: cpu.py gets every example right; microcode.py passes check_rom</text><text x="650" y="512" font-size="11" xml:space="preserve" text-anchor="middle" font-weight="normal" fill="#1b2733" font-family="Helvetica, Arial, sans-serif">D: ALU against Python's own + - * //  (tests/test_all.py)      D: CLI works with any model that has the interface above</text><text x="650" y="540" font-size="11" xml:space="preserve" text-anchor="middle" font-weight="normal" fill="#666" font-family="Helvetica, Arial, sans-serif">Shared: bench.py - B presents the 4 vs 6-stage table, C the H vs V table, D the ALU table.    Phase 2 (already built): preprocessor.py, stackview.py, stack checks</text></svg>